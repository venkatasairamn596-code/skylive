<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline – Live Weather</title>
<style>
:root{--g1:#6d5dfc;--g2:#2bb3d9;--shade:0;--glass:rgba(255,255,255,.16);--glass2:rgba(255,255,255,.26);--edge:rgba(255,255,255,.28);--ink:#fff;--soft:rgba(255,255,255,.78)}
[data-theme="dark"]{--shade:.38;--glass:rgba(10,18,32,.34);--glass2:rgba(255,255,255,.1);--edge:rgba(255,255,255,.14)}
body[data-wx="sunny"]{--g1:#ff9a5a;--g2:#e5457a}
body[data-wx="cloudy"]{--g1:#7f8fc4;--g2:#4b5a94}
body[data-wx="rain"]{--g1:#3f5fb5;--g2:#1b2a63}
body[data-wx="snow"]{--g1:#7fc8e8;--g2:#6a7fd1}
body[data-wx="night"]{--g1:#2a1f5c;--g2:#0a0a24}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,var(--g1),var(--g2)) fixed;transition:background .6s}
body::before{content:"";position:fixed;inset:0;background:#000;opacity:var(--shade);pointer-events:none;transition:opacity .4s}
#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.drop{position:absolute;top:-8vh;width:2px;height:70px;background:linear-gradient(transparent,rgba(190,215,255,.7));animation:fall linear infinite}
.flake{position:absolute;top:-4vh;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.85;animation:snow linear infinite}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
.glow{position:absolute;top:-160px;right:-120px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,170,.75),transparent 68%);animation:pulse 6s ease-in-out infinite}
.cloud{position:absolute;width:260px;height:80px;border-radius:80px;background:rgba(255,255,255,.14);filter:blur(14px);animation:drift linear infinite}
@keyframes fall{to{transform:translateY(115vh)}}
@keyframes snow{to{transform:translate(40px,110vh)}}
@keyframes tw{50%{opacity:.15}}
@keyframes pulse{50%{transform:scale(1.12);opacity:.8}}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(110vw)}}
.wrap{position:relative;max-width:980px;margin:0 auto;padding:20px 20px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.brand{font:700 22px/1 Georgia,serif;letter-spacing:.2px;margin-right:auto}
form{display:flex;align-items:center;flex:1 1 380px;max-width:520px;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:5px 5px 5px 16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:box-shadow .2s,background .2s}
form:focus-within{box-shadow:0 0 0 3px rgba(255,255,255,.4);background:var(--glass2)}
form svg,.tgl svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;padding:8px 10px}
input::placeholder{color:var(--soft)}
#go{display:grid;place-items:center;min-width:84px;height:40px;border:0;border-radius:999px;background:#fff;color:#16284a;font:600 15px inherit;font-family:inherit;cursor:pointer;transition:transform .15s}
#go:hover{transform:scale(1.04)}
#go:disabled{cursor:wait;opacity:.85}
.spin{width:18px;height:18px;border:2.5px solid #c5cfe4;border-top-color:#16284a;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.tgl{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--ink);cursor:pointer;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .2s}
.tgl:hover{transform:rotate(18deg)}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.14)}
.in{animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:32px}
.place{font:600 30px/1.15 Georgia,serif}
.when{color:var(--soft);margin-top:2px}
.temp{font-size:104px;line-height:1;font-weight:200;letter-spacing:-4px;margin:14px 0 4px}
.cond{font-size:22px;font-weight:600}
.meta{color:var(--soft);margin-top:2px}
.big{font-size:150px;line-height:1;filter:drop-shadow(0 14px 24px rgba(0,0,0,.3));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.sun{display:flex;gap:28px;margin-top:20px;padding-top:16px;border-top:1px solid var(--edge);grid-column:1/-1}
.sun div{color:var(--soft);font-size:14px}.sun b{display:block;color:var(--ink);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.stat{padding:20px;transition:transform .2s,background .2s}
.stat:hover{transform:translateY(-4px);background:var(--glass2)}
.stat .ic{font-size:26px}.stat .l{color:var(--soft);font-size:14px;margin-top:6px}.stat .v{font-size:26px;font-weight:600}
h2{font-size:18px;margin:30px 4px 12px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.day{padding:16px 10px;text-align:center;transition:transform .2s,background .2s}
.day:hover{transform:translateY(-4px);background:var(--glass2)}
.day .d{font-weight:600}.day .dt{color:var(--soft);font-size:13px}
.day .i{font-size:38px;margin:8px 0 4px}.day .c{color:var(--soft);font-size:13px;min-height:38px;line-height:1.3}
.day .r{font-weight:600;margin-top:6px}.day .r span{color:var(--soft);font-weight:400}
.error{padding:36px 28px;text-align:center}
.error .e{font-size:56px}.error h3{margin:8px 0 4px;font-size:22px}.error p{margin:0 auto 18px;max-width:420px;color:var(--soft)}
.error button{padding:11px 22px;border:0;border-radius:999px;background:#fff;color:#16284a;font:600 15px inherit;font-family:inherit;cursor:pointer}
.sk{background:linear-gradient(90deg,var(--glass),var(--glass2),var(--glass));background-size:200% 100%;animation:sh 1.3s infinite;border-radius:16px}
@keyframes sh{to{background-position:-200% 0}}
.foot{margin-top:32px;text-align:center;font-size:13px;color:var(--soft)}
@media (max-width:820px){.days{grid-template-columns:1fr}.day{display:grid;grid-template-columns:70px 44px 1fr auto;gap:10px;align-items:center;text-align:left;padding:12px 16px}
.day .i{margin:0;font-size:30px}.day .c{min-height:0}.day .r{margin:0}.day:hover{transform:none}}
@media (max-width:640px){header{flex-wrap:wrap}.brand{flex:1}form{order:3;max-width:none;flex-basis:100%}
.hero{grid-template-columns:1fr;padding:24px;text-align:center}.hero .big{order:-1;font-size:96px}.temp{font-size:84px}.place{font-size:26px}.sun{justify-content:center;gap:40px}
.grid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body data-wx="cloudy">
<div id="fx" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="brand">Skyline</div>
    <form id="f" role="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Search a city, e.g. Hyderabad" aria-label="City name" autocomplete="off">
      <button id="go" type="submit">Search</button>
    </form>
    <button class="tgl" id="theme" type="button" aria-label="Toggle light and dark mode"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
  </header>
  <div id="out" aria-live="polite"></div>
  <p class="foot">Live data from open-meteo.com. No API key required.</p>
</div>

<script>
const GEO = "https://geocoding-api.open-meteo.com/v1/search";
const WX  = "https://api.open-meteo.com/v1/forecast";
const out = document.getElementById("out");
const input = document.getElementById("q");
const btn = document.getElementById("go");
const fx = document.getElementById("fx");
let clockTimer = null;

// WMO weather codes -> label + emoji
const CODES = {0:["Clear sky","☀️"],1:["Mostly clear","🌤️"],2:["Partly cloudy","⛅"],3:["Overcast","☁️"],
45:["Fog","🌫️"],48:["Rime fog","🌫️"],51:["Light drizzle","🌦️"],53:["Drizzle","🌦️"],55:["Heavy drizzle","🌧️"],
56:["Freezing drizzle","🌧️"],57:["Freezing drizzle","🌧️"],61:["Light rain","🌧️"],63:["Rain","🌧️"],65:["Heavy rain","🌧️"],
66:["Freezing rain","🌧️"],67:["Freezing rain","🌧️"],71:["Light snow","🌨️"],73:["Snow","🌨️"],75:["Heavy snow","❄️"],77:["Snow grains","🌨️"],
80:["Rain showers","🌦️"],81:["Rain showers","🌧️"],82:["Violent showers","⛈️"],85:["Snow showers","🌨️"],86:["Heavy snow showers","❄️"],
95:["Thunderstorm","⛈️"],96:["Thunderstorm, hail","⛈️"],99:["Thunderstorm, hail","⛈️"]};
const code = c => CODES[c] || ["Unknown","🌡️"];
const icon = (c, day = 1) => day ? code(c)[1] : (c === 0 || c === 1 ? "🌙" : c === 2 ? "☁️" : code(c)[1]);
const kind = c => c <= 1 ? "sunny" : c <= 48 ? "cloudy" : (c >= 71 && c <= 77) || c === 85 || c === 86 ? "snow" : "rain";

// Fetch helper: timeout + HTTP status check
async function getJSON(url, ms = 8000){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try{
    const res = await fetch(url, {signal: ctl.signal});
    if(!res.ok) throw new Error("The weather service returned an error (" + res.status + ").");
    return await res.json();
  }catch(e){
    if(e.name === "AbortError") throw new Error("The request timed out. Check your connection and try again.");
    if(e instanceof TypeError) throw new Error("Couldn't reach the server. Check your internet connection.");
    throw e;
  }finally{ clearTimeout(t); }
}

function esc(s){ return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

// Theme (light/dark), persisted
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem("theme", t); }catch(_){}
}
document.getElementById("theme").onclick = () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
let saved = null;
try{ saved = localStorage.getItem("theme"); }catch(_){}
setTheme(saved || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"));

// Weather-themed background + particle effects
function el(cls, style){ const d = document.createElement("div"); d.className = cls; d.style.cssText = style; return d; }
const rnd = (a, b) => a + Math.random() * (b - a);
function setScene(c, day){
  const k = kind(c);
  document.body.dataset.wx = day ? k : "night";
  fx.innerHTML = "";
  const add = (n, f) => { for(let i = 0; i < n; i++) fx.appendChild(f()); };
  if(k === "rain") add(c >= 80 ? 80 : 55, () => el("drop", "left:" + rnd(0, 100) + "%;animation-duration:" + rnd(.55, 1) + "s;animation-delay:-" + rnd(0, 1) + "s;opacity:" + rnd(.3, .8)));
  else if(k === "snow") add(50, () => { const s = rnd(4, 9); return el("flake", "--s:" + s + "px;left:" + rnd(0, 100) + "%;animation-duration:" + rnd(6, 12) + "s;animation-delay:-" + rnd(0, 10) + "s"); });
  else if(!day) add(60, () => el("star", "left:" + rnd(0, 100) + "%;top:" + rnd(0, 70) + "%;animation-delay:-" + rnd(0, 3) + "s"));
  else if(k === "sunny") fx.appendChild(el("glow", ""));
  if(k === "cloudy") add(3, (i) => el("cloud", "top:" + rnd(5, 55) + "%;animation-duration:" + rnd(60, 110) + "s;animation-delay:-" + rnd(0, 80) + "s"));
}

function showLoading(){
  out.innerHTML = '<div class="sk" style="height:330px"></div>' +
    '<div class="grid">' + '<div class="sk" style="height:112px"></div>'.repeat(6) + '</div>' +
    '<div class="days" style="margin-top:44px">' + '<div class="sk" style="height:170px"></div>'.repeat(7) + '</div>';
}

function showError(msg, retry){
  out.innerHTML = '<div class="glass error in" role="alert"><div class="e">🌧️</div><h3>We couldn\'t load the weather</h3><p>' + esc(msg) + '</p>' +
    (retry ? '<button id="retry">Try again</button>' : '') + '</div>';
  if(retry) document.getElementById("retry").onclick = retry;
}

const fmtTime = s => new Date(s).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
const stat = (i, ic, l, v) => '<div class="glass stat in" style="--i:' + i + '"><div class="ic">' + ic + '</div><div class="l">' + l + '</div><div class="v">' + v + '</div></div>';

function tick(tz){
  const n = document.getElementById("clock");
  if(n) n.textContent = new Date().toLocaleString("en-US", {timeZone: tz, weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit"});
}

function render(place, d){
  const c = d.current, day = c.is_day, [label] = code(c.weather_code), dl = d.daily;
  setScene(c.weather_code, day);
  const vis = c.visibility != null ? (c.visibility / 1000 >= 10 ? "10+" : (c.visibility / 1000).toFixed(1)) + " km" : "N/A";
  const pres = c.pressure_msl != null ? Math.round(c.pressure_msl) + " hPa" : "N/A";
  const days = dl.time.map((t, i) => {
    const dt = new Date(t + "T00:00");
    return '<div class="glass day in" style="--i:' + (i + 8) + '"><div><div class="d">' + (i === 0 ? "Today" : dt.toLocaleDateString(undefined, {weekday: "short"})) +
      '</div><div class="dt">' + dt.toLocaleDateString(undefined, {day: "numeric", month: "short"}) + '</div></div><div class="i">' + icon(dl.weather_code[i]) +
      '</div><div class="c">' + code(dl.weather_code[i])[0] + '</div><div class="r">' + Math.round(dl.temperature_2m_max[i]) + '° <span>' + Math.round(dl.temperature_2m_min[i]) + '°</span></div></div>';
  }).join("");
  out.innerHTML =
    '<section class="glass hero in"><div><div class="place">' + esc(place) + '</div><div class="when" id="clock"></div>' +
    '<div class="temp">' + Math.round(c.temperature_2m) + '°</div><div class="cond">' + label + '</div>' +
    '<div class="meta">Feels like ' + Math.round(c.apparent_temperature) + '° · High ' + Math.round(dl.temperature_2m_max[0]) + '° · Low ' + Math.round(dl.temperature_2m_min[0]) + '°</div></div>' +
    '<div class="big">' + icon(c.weather_code, day) + '</div>' +
    '<div class="sun"><div>🌅 Sunrise<b>' + fmtTime(dl.sunrise[0]) + '</b></div><div>🌇 Sunset<b>' + fmtTime(dl.sunset[0]) + '</b></div></div></section>' +
    '<div class="grid">' +
    stat(1, "💧", "Humidity", c.relative_humidity_2m + "%") +
    stat(2, "💨", "Wind speed", Math.round(c.wind_speed_10m) + " km/h") +
    stat(3, "🌧️", "Precipitation", c.precipitation + " mm") +
    stat(4, "🌡️", "Feels like", Math.round(c.apparent_temperature) + "°C") +
    stat(5, "👁️", "Visibility", vis) +
    stat(6, "🧭", "Pressure", pres) + '</div>' +
    '<h2>7-day forecast</h2><div class="days">' + days + '</div>';
  tick(d.timezone); clearInterval(clockTimer); clockTimer = setInterval(() => tick(d.timezone), 30000);
}

async function search(city){
  city = city.trim();
  if(!city){ showError("Enter a city name to search.", null); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; showLoading();
  try{
    const g = await getJSON(GEO + "?count=1&language=en&name=" + encodeURIComponent(city));
    if(!g.results || !g.results.length){ showError('No city found for "' + city + '". Check the spelling or try a nearby city.', null); return; }
    const p = g.results[0];
    const wx = await getJSON(WX + "?latitude=" + p.latitude + "&longitude=" + p.longitude +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,precipitation,weather_code,is_day,visibility,pressure_msl" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=7&timezone=auto");
    render([p.name, p.admin1, p.country].filter(Boolean).join(", "), wx);
    try{ localStorage.setItem("lastCity", city); }catch(_){}
  }catch(e){
    showError(e.message, () => search(city));
  }finally{ btn.disabled = false; btn.textContent = "Search"; }
}

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); search(input.value); });

let last = "Hyderabad";
try{ last = localStorage.getItem("lastCity") || last; }catch(_){}
input.value = last;
search(last);
</script>
</body>
</html>
